<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Closed Lost Renewals</title>
    <meta name="description" content="Browse, filter and work Q4 2024 Closed Lost SBS opportunities coming up for renewal." />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cl.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Filled by importer/build_standalone.py in the single-file build; empty when served by Flask. -->
    <script id="cl-data" type="application/gzip+base64"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
