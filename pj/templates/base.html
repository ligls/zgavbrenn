<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}Prospection{% endblock %} — PagesJaunes QC</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="entete">
  <a class="marque" href="{{ url_for('index') }}">Prospection <span>PagesJaunes QC</span></a>
  <nav>
    <a href="{{ url_for('index') }}">Entreprises</a>
    <a href="{{ url_for('scraping') }}">Scraping</a>
  </nav>
</header>

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="messages">
        {% for categorie, message in messages %}
          <p class="message message--{{ categorie }}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block contenu %}{% endblock %}
</main>
</body>
</html>
